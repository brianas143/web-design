<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff0f4"><title>For Gabriela 💐</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Great+Vibes&display=swap');
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 25% 15%,#fff8f8 0,transparent 36%),radial-gradient(circle at 80% 80%,#ffd9e4,transparent 50%),linear-gradient(155deg,#ffe9f0,#f8d3df 65%,#f6bfd2);font-family:'DM Sans',sans-serif;color:#823b5a;overflow-x:hidden}main{min-height:100svh;display:grid;place-items:center;padding:28px 16px}.card{position:relative;width:min(100%,450px);min-height:670px;padding:34px 20px 28px;border-radius:36px;text-align:center;background:rgba(255,255,255,.49);border:1px solid rgba(255,255,255,.85);box-shadow:0 18px 70px #b85b8330;overflow:hidden;isolation:isolate}.card:before{content:"";position:absolute;inset:10px;border:1px solid #e7a7bc85;border-radius:28px;pointer-events:none}.eyebrow{font-size:11px;letter-spacing:3.2px;text-transform:uppercase;color:#ab6482;font-weight:600}.name{font:normal clamp(58px,15vw,78px)/1 'Great Vibes',cursive;margin:17px 0 4px;color:#b24472;text-shadow:0 5px 18px #fffc}.subtitle{font-size:13px;color:#9b647c;letter-spacing:.5px}.bouquet{width:min(100%,355px);margin:-1px auto -4px;display:block;overflow:visible;filter:drop-shadow(0 16px 16px #a55f8240);transform-origin:50% 90%;animation:sway 5s ease-in-out infinite}.bloom{transform-box:fill-box;transform-origin:center;animation:breathe 4.2s ease-in-out infinite}.bloom:nth-of-type(even){animation-delay:-2s}@keyframes sway{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-6px)}}@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}.headline{font:normal 43px/1.1 'Great Vibes',cursive;margin:4px 0 8px;color:#b24472}.note{font-size:13px;line-height:1.7;color:#86546b;margin:0 auto;max-width:280px}.sign{font-size:12px;letter-spacing:1.1px;color:#ad6e89;margin-top:18px}.particle{position:fixed;pointer-events:none;z-index:2;animation:rise var(--duration) linear forwards;opacity:0;filter:drop-shadow(0 1px 2px #b75e7a3d)}@keyframes rise{0%{transform:translate3d(0,20px,0) scale(.7) rotate(-20deg);opacity:0}15%{opacity:.8}85%{opacity:.8}100%{transform:translate3d(var(--drift),-105vh,0) scale(1.2) rotate(30deg);opacity:0}}.sparkle{position:absolute;color:#e5a4bc;font-size:21px;animation:twinkle 2.7s ease-in-out infinite}.s1{top:185px;left:33px}.s2{top:240px;right:28px;animation-delay:1.2s}.s3{top:410px;left:20px;animation-delay:.7s}@keyframes twinkle{50%{transform:scale(1.4);opacity:.35}}.cover{position:absolute;inset:0;z-index:5;background:linear-gradient(155deg,#fff5f7,#f8d7e2);display:grid;place-items:center;padding:24px;transition:opacity 1s,visibility 1s}.cover.hidden{opacity:0;visibility:hidden}.seal{font-size:67px;animation:pulse 2.8s infinite}@keyframes pulse{50%{transform:scale(1.12)}}.cover h2{font:normal 57px/1.1 'Great Vibes',cursive;margin:16px 0;color:#ae4771}.cover p{font-size:14px;color:#97647b}.open{border:0;border-radius:99px;background:#bc557e;color:white;padding:15px 34px;font:600 13px 'DM Sans',sans-serif;letter-spacing:1px;box-shadow:0 8px 22px #bc557e55;cursor:pointer;margin-top:10px}.open:hover{background:#a8456b}@media(max-width:380px){.card{min-height:625px;padding-top:28px}.bouquet{width:300px}.name{font-size:58px}}@media(prefers-reduced-motion:reduce){.bouquet,.bloom,.sparkle,.seal{animation:none}.particle{display:none}}
</style></head><body><main><section class="card" aria-label="A bouquet for Gabriela">
<div class="sparkle s1">✧</div><div class="sparkle s2">✦</div><div class="sparkle s3">✧</div>
<div class="eyebrow">a little something just for you</div><h1 class="name">Gabriela</h1><div class="subtitle">a bouquet to brighten your day ♡</div>

<!-- stems and foliage -->
<g fill="none" stroke="#5c9672" stroke-width="5" stroke-linecap="round"><path d="M177 276Q117 180 98 104"/><path d="M177 276Q144 156 154 68"/><path d="M177 276Q174 169 200 81"/><path d="M177 276Q224 164 263 108"/><path d="M177 276Q229 193 288 163"/><path d="M177 276Q122 212 74 165"/></g>

<g class="bloom"><use href="#daisy" transform="translate(267 132) scale(.83)"/></g>
<g class="bloom"><use href="#rose" transform="translate(76 164) scale(.77)"/></g>

<!-- bouquet paper in foreground -->
<path d="M53 175Q98 189 175 200Q245 187 306 172L224 323Q204 343 180 353Q159 339 140 319Z" fill="url(#paper)" stroke="#e4a4bf" stroke-width="1.5"/>

<path d="M178 279Q146 244 124 269Q129 296 178 283Z" fill="#c64c7c"/><path d="M181 279Q210 244 232 269Q226 296 181 283Z" fill="#dc6a98"/><path d="M174 283Q151 319 162 343L189 304Z" fill="#bf4978"/><path d="M187 285Q210 315 210 338L179 301Z" fill="#e579a2"/><ellipse cx="180" cy="284" rx="13" ry="11" fill="#ed8fb0"/><path d="M137 271Q159 261 173 280M221 269Q203 263 191 280" stroke="#ffc7dc" stroke-width="3" fill="none" opacity=".85"/>
</svg>
<h2 class="headline">You're amazing ♡</h2><p class="note">A little reminder that you make the world a lovelier place just by being you.</p><div class="sign">WITH LOVE, BRIANA ✿</div>
<div class="cover" id="cover"><div><div class="seal">💌</div><h2>For Gabriela</h2><p>A little surprise is waiting for you...</p><button class="open" id="open" type="button">Open your bouquet ♡</button></div></div>
</section></main>
<script>
const cover=document.getElementById('cover');let timer;
function heart(){const e=document.createElement('span');e.className='particle';e.textContent=['♡','♥','✿','✧','💕'][Math.floor(Math.random()*5)];e.style.left=Math.random()*100+'vw';e.style.bottom='-30px';e.style.fontSize=(14+Math.random()*19)+'px';e.style.color=['#c65b88','#e79bb9','#b87aab'][Math.floor(Math.random()*3)];e.style.setProperty('--drift',(Math.random()*120-60)+'px');const d=5+Math.random()*4;e.style.setProperty('--duration',d+'s');document.body.append(e);setTimeout(()=>e.remove(),d*1000)}
document.getElementById('open').addEventListener('click',()=>{cover.classList.add('hidden');for(let i=0;i<22;i++)setTimeout(heart,i*85);timer=setInterval(heart,430)},{once:true});
</script></body></html>
